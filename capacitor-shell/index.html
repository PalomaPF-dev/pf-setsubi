<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paloma設備管理</title>
    <style>
      html,body{margin:0;height:100%;background:#f8fafc;font-family:'Hiragino Sans',sans-serif;color:#334155}
      .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
      .mark{width:72px;height:72px;border-radius:16px;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:40px;margin-bottom:16px}
      h1{font-size:16px;margin:0 0 8px}
      p{font-size:13px;color:#64748b;margin:0}
      button{margin-top:22px;padding:11px 28px;border:none;border-radius:10px;background:#ea580c;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
      button:disabled{opacity:.5}
      .status{margin-top:12px;font-size:11px;color:#94a3b8}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">設</div>
      <h1>Paloma設備管理</h1>
      <p>ネットワークに接続できません。<br />接続を確認して再度お試しください。</p>
      <button id="retry">再読み込み</button>
      <p class="status" id="status">接続を確認しています…</p>
    </div>
    <script>
      var LIVE = "https://sumakouba-setsubi.vercel.app";
      var btn = document.getElementById("retry");
      var status = document.getElementById("status");
      function reload() { location.replace(LIVE); }
      btn.addEventListener("click", function () {
        btn.disabled = true;
        status.textContent = "再読み込み中…";
        reload();
      });
      // オンライン復帰時は自動でライブサイトへ
      window.addEventListener("online", reload);
      // 起動直後、接続があればライブへ
      if (navigator.onLine) setTimeout(reload, 400);
    </script>
  </body>
</html>
